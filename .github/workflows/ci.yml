name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    # The core must pass with nothing installed. If this job ever needs a
    # dependency, the core has grown one by accident.
    name: core (no dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Installed, not just importable from the repo root -- so packaging
      # breakage fails here rather than for whoever clones it.
      - run: pip install -e .
      - run: python -m unittest discover -s tests -t . -v
      - run: python run_benchmarks.py
      # Scoring, not pinning: fails if the auditor stops beating a constant
      # answer on the suite, which no single-verdict test would catch.
      - run: python run_trust.py
      - run: python run_audit_loop.py
      # Stdlib only: circuit memory needs no backend.
      # The service surface must advertise exactly what it implements.
      - run: python mcp_server.py --list > /dev/null
      - run: python examples/memory_pays_off.py
      - run: python examples/attack_a_pipeline.py
      - run: qem-auditor template > /tmp/t.json && qem-auditor validate /tmp/t.json
      # The wiring, exercised as a user meets it: a verdict arrives with a
      # remedy, and a second audit remembers the first.
      - run: |
          set +e
          QEM_AUDITOR_STORE=/tmp/qemstore qem-auditor audit /tmp/t.json > /tmp/a1.txt
          QEM_AUDITOR_STORE=/tmp/qemstore qem-auditor audit /tmp/t.json > /tmp/a2.txt
          set -e
          grep -q "NO REMEDY OFFERED" /tmp/a1.txt
          grep -q "WHAT THIS REMINDS THE AUDITOR OF" /tmp/a2.txt
          QEM_AUDITOR_STORE=/tmp/qemstore qem-auditor remember | grep -q "remembered"
      # Every CLI subcommand, so a broken entry point fails here rather
      # than for whoever runs it. `audit` and `attack` exit non-zero by
      # design on an unproven record, so the exit CODE is what gets
      # asserted, not the absence of one.
      #
      # errexit has to come off around the calls themselves: the runner
      # uses `bash -e`, under which `cmd; test $? -eq 1` still aborts on
      # cmd's own failure and never reaches the assertion. Capture first,
      # assert after.
      - run: |
          set +e
          qem-auditor audit  /tmp/t.json > /dev/null; audit=$?
          qem-auditor attack /tmp/t.json > /dev/null; attack=$?
          qem-auditor blind  /tmp/t.json > /dev/null; blind=$?
          qem-auditor investigate /tmp/t.json --html /tmp/r.html > /dev/null; inv=$?
          set -e
          echo "audit=$audit attack=$attack blind=$blind investigate=$inv"
          test -s /tmp/r.html      # the HTML report is non-empty
          test "$inv" -eq 1        # nothing certified, so non-zero
          test "$audit"  -eq 1   # not certified
          test "$attack" -eq 1   # attack surface untested
          test "$blind"  -eq 0   # blind decision was correct

  adapters:
    name: adapters (qiskit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Devices too, and BEFORE the tests: the drift check that compares
      # the example's pinned calibration against the fake_kyiv snapshot
      # skips when it is missing, which would quietly retire the check.
      - run: pip install -e ".[adapters,devices]" qiskit-aer
      - run: python -m unittest discover -s tests -t . -v
      - run: python examples/verify_zne_claim.py
      - run: python examples/adversarial_loop.py
      # Pure-stdlib: the fit-based attacks need no backend at all.
      - run: python examples/attack_a_pipeline.py
      - run: python examples/autonomous_audit.py
      - run: python examples/check_under_noise.py
      # A live end-to-end audit: real molecule, real noise, real mitigation,
      # numbers the auditor measured itself rather than any record on disk.
      - run: python examples/live_h2_audit.py
      # The same claim under IBM's MEASURED fake_kyiv calibration, which
      # is where ZNE's improvement collapses.
      - run: python examples/real_device_audit.py
      # Nine methods, two noise models, one auditor. --quick halves the
      # runs; the findings it checks hold at either size.
      - run: python examples/method_shootout.py --quick
      # The other half of the loop: estimate the budget from calibration,
      # prescribe from it, then RUN the advice and check it held.
      - run: python examples/prescribe_for_circuit.py
      # Qubit selection driven by the error budget, and the ledger that
      # makes each audit inform the next.
      - run: python examples/better_next_time.py
      # A second physical system: does any of the above generalise?
      - run: python examples/second_system.py
      # The question that matters: a circuit nobody here has seen.
      - run: python examples/bring_your_own_circuit.py
      # A circuit from outside this project, with a specification attached:
      # the correctness gate that has to pass before mitigation is a question.
      - run: python examples/audit_an_oracle.py
      # The control experiment, ported from quantum-verifier, plus the two
      # bars that say which of its numbers are findings.
      - run: python examples/control_experiment.py
      # The front door: the starting point we hand people must actually run.
      - run: |
          qem-auditor check --template > /tmp/c.py
          python -c "compile(open('/tmp/c.py').read(),'t','exec')"
          set +e
          qem-auditor check /tmp/c.py > /dev/null; chk=$?
          set -e
          echo "check=$chk"
          test "$chk" -eq 1   # measured what it could; cannot certify from artifacts
