[build-system]
# 77 is the floor for PEP 639 (`license` as an SPDX string plus
# `license-files`). The older table form and the License classifier are
# both deprecated and stop building on 2027-02-18, per setuptools' own
# warning -- a dated expiry is worth fixing now rather than rediscovering
# from a failed release.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qem-auditor"
version = "0.1.0"
description = "An auditor for quantum error-mitigation claims: gates, verdicts, failure diagnosis, and experiment planning."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Venkat Allu", email = "alluvenkat11@gmail.com" }]
keywords = ["quantum", "error-mitigation", "verification", "reproducibility", "qiskit"]
classifiers = [
    # Alpha, matching the `experimental` maturity this project declared to
    # the Qiskit Ecosystem. Claiming Beta here and experimental there
    # would be the same claim told two ways, which is the failure mode
    # this package audits other people for.
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]

# The core has NO runtime dependencies, deliberately: the thing deciding
# whether a scientific claim passed should be readable and runnable by
# anyone, with no version skew available to explain a verdict away.
dependencies = []

[project.optional-dependencies]
# Needed only to EXECUTE controls rather than grade a record as written.
# Qiskit 2.0 is the floor because that is what is actually tested: CI
# installs the current release (2.5 at time of writing) and the whole
# suite runs against it. The previous ">=1.0" was a compatibility claim
# nothing here verified, which is the kind of unchecked claim this
# package exists to object to.
adapters = ["qiskit>=2.0", "qiskit-aer>=0.14"]
# Real device calibration snapshots. Optional even for the adapters:
# examples/real_device_audit.py pins the numbers it needs so it runs on
# aer alone, and tests/test_real_device.py checks the pinned copy against
# the snapshot whenever this IS installed, so it cannot drift unnoticed.
devices = ["qiskit-ibm-runtime>=0.20"]
# The auditor as a live service. Deliberately NOT a device-access surface:
# see mcp_server.py for why that half is left to quantum-verifier.
service = ["mcp>=1.2"]

[project.scripts]
qem-auditor = "qem_auditor.cli:main"

[project.urls]
Homepage = "https://github.com/Venkatallu11/qem-auditor"
Source = "https://github.com/Venkatallu11/qem-auditor"
Issues = "https://github.com/Venkatallu11/qem-auditor/issues"
"Qiskit Ecosystem" = "https://qisk.it/e"

[tool.setuptools]
packages = ["qem_auditor", "qem_auditor.adapters"]

# 98% of public functions carry return annotations, so shipping the
# marker is a claim the code actually backs rather than an aspiration.
[tool.setuptools.package-data]
qem_auditor = ["py.typed"]
